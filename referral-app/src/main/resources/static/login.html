<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=20260517-unified-ui-1">
    <title>登录系统 - 校友内推平台</title>
    <link rel="stylesheet" href="/style.css?v=20260518-unified-ui-13">
</head>
<body class="login-page login-page-cyber">
<div class="login-scene login-scene-cyber" aria-hidden="true">
    <span class="login-grid"></span>
    <span class="login-star login-star-1"></span>
    <span class="login-star login-star-2"></span>
    <span class="login-star login-star-3"></span>
</div>

<div class="login-shell login-shell-cyber">
    <form class="login-card login-card-cyber" id="login-form">
        <div class="login-logo-row">
            <span class="login-logo-mark">IR</span>
            <span class="login-logo-text">校友内推平台</span>
        </div>
        <div class="login-card-top">
            <div>
                <span class="form-kicker">登录入口</span>
                <h2>欢迎回来</h2>
                <p>登录后进入学生、校友或管理员工作台，继续查看岗位、处理申请与沟通消息。</p>
            </div>
        </div>

        <label class="form-field">
            <span>用户名</span>
            <input name="username" placeholder="请输入用户名" autocomplete="username">
        </label>
        <label class="form-field">
            <span>密码</span>
            <input name="password" type="password" placeholder="请输入密码" autocomplete="current-password">
        </label>

        <button type="submit" class="btn btn-hero">立即登录</button>
        <div class="login-result" id="login-result">请输入账号密码后进入系统。</div>
        <div class="login-switch">还没有账号？<a href="/register.html">注册账号</a></div>
    </form>

    <section class="login-hero login-hero-cyber">
        <div class="brand-hero-panel">
            <div class="brand-hero-chip">系统概览</div>
            <div class="brand-hero-copy">
                <h1>校友内推<br>信息管理与对接系统</h1>
                <p>聚合岗位发布、简历投递、申请流转与消息协同，为学生、校友和管理员提供统一的求职协作入口。</p>
            </div>
            <div class="brand-hero-surface">
                <div class="surface-grid surface-grid-a"></div>
                <div class="surface-grid surface-grid-b"></div>
                <div class="surface-beam surface-beam-a"></div>
                <div class="surface-beam surface-beam-b"></div>
                <div class="surface-card surface-card-main">
                    <span>学生端</span>
                    <strong>岗位浏览与投递</strong>
                </div>
                <div class="surface-card surface-card-side">
                    <span>校友端</span>
                    <strong>岗位发布与申请处理</strong>
                </div>
                <div class="surface-card surface-card-mini">
                    <span>治理端</span>
                    <strong>审核治理与数据总览</strong>
                </div>
            </div>
        </div>
    </section>
</div>
<script src="/common.js?v=20260615-register-flow-1"></script>
<script src="/login.js?v=20260615-register-flow-1"></script>
</body>
</html>
